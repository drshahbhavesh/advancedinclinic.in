<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quando&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            background-color: #fcfaf9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .dashboard-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background: #ffffff;
            color: #49444c;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            flex-shrink: 0;
            border-bottom: 3px solid #87008c;
        }
        .navbar .logo {
            font-family: "Open Sans", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #3a3a3a;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        .nav-links a {
            color: #3a3a3a;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #87008c;
        }
        .nav-links .appointment-btn {
            background-color: #72bfba;
            color: #fff;
            padding: 9px 20px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            border: none;
        }
        .nav-links .appointment-btn:hover {
            background-color: #5aa9a4;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 19px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #3a3a3a;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        
        .controls-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid rgba(125,152,163,0.31);
            background: #fdfaf8;
            flex-shrink: 0;
            gap: 20px;
        }
        
        .controls-left {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
        }
        
        .controls-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
        }

        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .arrow-btn {
            background: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            color: #49444c;
            transition: background-color 0.2s;
        }
        .arrow-btn:hover {
            background-color: #72bfba;
            color: #fff;
        }
        .date-input {
            font-family: "Open Sans", sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #49444c;
            border: 1px solid rgba(125,152,163,0.31);
            padding: 7px 12px;
            border-radius: 3px;
            text-align: center;
            background: #f5f2ea;
        }
        
        .toggle-container {
            display: flex;
            background: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            padding: 2px;
            gap: 2px;
        }
        .toggle-btn {
            font-family: "Open Sans", sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #7a7a7a;
            background: transparent;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .toggle-btn.active {
            background: #72bfba;
            color: #fff;
        }

        .create-btn {
            font-family: "Open Sans", sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #72bfba;
            border: none;
            border-radius: 3px;
            padding: 10px 22px;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            transition: background-color 0.2s;
        }
        .create-btn:hover {
            background-color: #5aa9a4;
        }
        .table-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .appointments-table {
            width: 100%;
            min-width: 1260px; 
            border-collapse: collapse;
            table-layout: fixed;
        }
        /* UPDATED: Clean padding values to maximize text space and eliminate clipping */
        .appointments-table th, .appointments-table td {
            border: 1px solid rgba(125,152,163,0.31);
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .appointments-table th {
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a7a7a;
            background-color: #fdfaf8;
        }
        
        /* Optimized Width Routing Matrices */
        .col-done { width: 4%; text-align: center; }
        .col-time { width: 6%; }
        .col-name { width: 13%; }
        .col-phone { width: 11%; }
        .col-age { width: 4%; }
        .col-address { width: 8%; } 
        .col-payment { width: 8%; }
        .col-type { width: 8%; }
        .col-ref { width: 10%; }
        .col-diagnosis { width: 12%; }
        .col-follow { width: 8%; }
        .col-actions { width: 4%; text-align: center; } /* Compact fit for Edit button row */
        .col-callback { width: 8%; }

        .completed-row {
            background-color: #e2f3ec !important;
        }
        .completed-row td {
            background-color: #e2f3ec !important;
        }

        .cell-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2f7a5f;
            display: block;
            margin: 0 auto;
        }

        .cell-input, .cell-select {
            width: 100%;
            border: none;
            border-bottom: 1px dashed rgba(125,152,163,0.5);
            background: transparent;
            padding: 2px 4px;
            font-size: 14px;
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            outline: none;
        }
        .cell-input:focus, .cell-select:focus {
            border-bottom: 1px solid #72bfba;
            background-color: #f5f2ea;
        }
        
        .action-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }
        .action-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
            border-radius: 3px;
            transition: transform 0.1s ease;
        }
        .action-icon-btn:hover {
            transform: scale(1.2);
        }
        
        .no-data {
            text-align: center;
            padding: 50px;
            color: #7a7a7a;
            font-style: italic;
            font-size: 15px;
        }
        #tableFooter {
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        .totals-row td {
            position: sticky;
            bottom: 0;
            background-color: #f5f2ea;
            border-top: 2px solid #72bfba;
            font-family: "Open Sans", sans-serif;
            padding: 14px 16px;
        }
        .totals-label {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
            color: #49444c;
        }
        .totals-value {
            font-weight: 700;
            font-size: 15px;
            color: #2f7a5f;
            white-space: nowrap;
        }
        #totalBreakdown {
            white-space: nowrap;
        }
        .breakdown-divider {
            display: inline-block;
            margin: 0 12px;
            color: rgba(47, 122, 95, 0.4);
            font-weight: 400;
        }
        @media (max-width: 950px) {
            .controls-bar {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                padding: 16px 20px;
            }
            .controls-left, .controls-center, .controls-right {
                justify-content: center;
            }
            .create-btn { width: 100%; }
        }
        @media (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
                padding: 16px 20px;
                position: relative;
            }
            .navbar .logo { font-size: 17px; }
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                margin-top: 14px;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 12px 4px;
                border-top: 1px solid rgba(125,152,163,0.25);
                text-align: center;
                font-size: 15px;
            }
            .nav-links .appointment-btn {
                margin-top: 10px;
                text-align: center;
            }
            .table-scroll-hint {
                display: block;
                text-align: center;
                font-size: 12px;
                color: #7a7a7a;
                padding: 8px 0 0;
                background: #fdfaf8;
            }
        }
        .table-scroll-hint { display: none; }

        /* ---- Login screen ---- */
        #loginScreen {
            position: fixed;
            inset: 0;
            background: #fcfaf9;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: #fff;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 6px;
            padding: 40px 36px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }
        .login-box h1 {
            font-family: "Open Sans", sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #3a3a3a;
            margin-bottom: 22px;
            text-align: center;
        }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #7a7a7a;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .login-field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            font-family: "Open Sans", sans-serif;
            font-size: 15px;
            background: #f5f2ea;
            color: #49444c;
            outline: none;
        }
        .login-field input:focus {
            border-color: #72bfba;
        }
        .login-error {
            color: #c0392b;
            font-size: 13px;
            margin-bottom: 14px;
            min-height: 16px;
            text-align: center;
        }
        .login-submit-btn {
            width: 100%;
            background: #72bfba;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 11px;
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .login-submit-btn:hover {
            background-color: #5aa9a4;
        }

        /* ---- Role badge + logout ---- */
        .role-badge {
            font-size: 12px;
            font-weight: 600;
            color: #7a7a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .logout-link {
            cursor: pointer;
        }

        /* ---- Reception role: hide the Done column entirely ---- */
        .role-reception .col-done,
        .role-reception .col-done-cell {
            display: none;
        }

        /* ---- Locked row (visited, viewed by reception) ---- */
        .locked-row .cell-input,
        .locked-row .cell-select {
            pointer-events: none;
            opacity: 0.6;
            border-bottom-style: solid;
        }
        .edit-btn[disabled] {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ---- Reception totals mask ---- */
        .totals-reveal {
            display: inline-flex;
            align-items: center;
            margin-left: 14px;
            vertical-align: middle;
        }
        .totals-reveal input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #87008c;
            border: 2px solid #87008c;
        }
    </style>
</head>
<body>

    <script>
        // ---- Simple client-side login gate ----
        // NOTE: This is a convenience lock, not real security. Anyone who opens
        // browser dev tools can read these credentials in the page source and see
        // both roles' data. Change these two passwords to your own before use,
        // and don't reuse a password used anywhere else.
        const CREDENTIALS = {
            reception: { username: 'reception', password: 'reception123' },
            doctor:    { username: 'bhavesh',    password: 'Bha@123' }
        };

        let userRole = null;

        const loginScreen = document.getElementById('loginScreen');
        const dashboardContainer = document.getElementById('dashboardContainer');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const roleBadge = document.getElementById('roleBadge');
        const logoutLink = document.getElementById('logoutLink');

        function attemptLogin() {
            const u = loginUsername.value.trim();
            const p = loginPassword.value;
            let matchedRole = null;

            for (const role in CREDENTIALS) {
                if (u === CREDENTIALS[role].username && p === CREDENTIALS[role].password) {
                    matchedRole = role;
                    break;
                }
            }

            if (!matchedRole) {
                loginError.textContent = "Incorrect username or password.";
                loginPassword.value = "";
                return;
            }

            sessionStorage.setItem('userRole', matchedRole);
            enterDashboard(matchedRole);
        }

        function enterDashboard(role) {
            userRole = role;
            loginScreen.style.display = "none";
            dashboardContainer.style.display = "flex";
            document.body.classList.toggle('role-reception', role === 'reception');
            roleBadge.textContent = role === 'doctor' ? "Doctor" : "Reception";
            if (window.syncAppointments) window.syncAppointments();
        }

        loginSubmitBtn.addEventListener('click', attemptLogin);
        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });
        loginUsername.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });

        logoutLink.addEventListener('click', () => {
            if (window.stopSync) window.stopSync();
            sessionStorage.removeItem('userRole');
            userRole = null;
            dashboardContainer.style.display = "none";
            loginScreen.style.display = "flex";
            loginUsername.value = "";
            loginPassword.value = "";
            loginError.textContent = "";
        });

        // Restore session on refresh (still within the same browser tab session)
        const savedRole = sessionStorage.getItem('userRole');
        if (savedRole && CREDENTIALS[savedRole]) {
            enterDashboard(savedRole);
        }

        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDstFH1FUnW3YQVk-XUWC5rjMWuWxo5jjA",
            authDomain: "appointment-booking-1f0d0.firebaseapp.com",
            projectId: "appointment-booking-1f0d0",
            storageBucket: "appointment-booking-1f0d0.firebasestorage.app",
            messagingSenderId: "572909099522",
            appId: "1:572909099522:web:a40cb6dc7fafe8ea7e651b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dateFilter = document.getElementById('dateFilter');
        const tableBody = document.getElementById('tableBody');
        const noDataMessage = document.getElementById('noDataMessage');
        const tableFooter = document.getElementById('tableFooter');
        const totalEarnedEl = document.getElementById('totalEarned');
        const totalCashEl = document.getElementById('totalCashText');
        const totalOnlineEl = document.getElementById('totalOnlineText');

        const consultationServiceBtn = document.getElementById('consultationServiceBtn');
        const laserServiceBtn = document.getElementById('laserServiceBtn');
        let activeService = 'Consultation';

        const morningShiftBtn = document.getElementById('morningShiftBtn');
        const afternoonShiftBtn = document.getElementById('afternoonShiftBtn');
        let activeShift = 'morning'; 

        const today = new Date();
        dateFilter.value = today.toISOString().split('T')[0];

        let unsubscribe = null;

        function syncAppointments() {
            if (unsubscribe) unsubscribe();

            const selectedDate = dateFilter.value;

            const q = query(
                collection(db, "appointments"),
                where("service_type", "==", activeService),
                where("appointment_date", "==", selectedDate)
            );

            unsubscribe = onSnapshot(q, (snapshot) => {
                tableBody.innerHTML = "";
                
                if (snapshot.empty) {
                    noDataMessage.style.display = "block";
                    tableFooter.style.display = "none";
                    resetCounters();
                    return;
                }

                const allDocs = [];
                snapshot.forEach(doc => allDocs.push({ id: doc.id, ...doc.data() }));
                
                const filteredDocs = allDocs.filter(data => {
                    if (!data.appointment_time) return false;
                    const hour = parseInt(data.appointment_time.split(':')[0], 10);
                    
                    if (activeShift === 'morning') {
                        return hour < 15; 
                    } else {
                        return hour >= 15; 
                    }
                });

                if (filteredDocs.length === 0) {
                    noDataMessage.style.display = "block";
                    tableFooter.style.display = "none";
                    resetCounters();
                    return;
                }
                
                noDataMessage.style.display = "none";
                filteredDocs.sort((a, b) => a.appointment_time.localeCompare(b.appointment_time));

                filteredDocs.forEach(data => {
                    const tr = document.createElement('tr');
                    
                    const isVisited = data.status === 'Visited';
                    if (isVisited) {
                        tr.classList.add('completed-row');
                    }

                    const isOnline = data.payment_type === 'Online' ? 'selected' : '';
                    const isCash = data.payment_type === 'Cash' ? 'selected' : '';
                    const isTypeUnset = (!isOnline && !isCash) ? 'selected' : '';

                    const isReception = userRole === 'reception';
                    const isLocked = isReception && isVisited;
                    if (isLocked) tr.classList.add('locked-row');

                    const doneCellHtml = isReception
                        ? `<td class="col-done-cell"></td>`
                        : `<td style="text-align: center;">
                            <input type="checkbox" class="cell-checkbox status-checkbox" data-id="${data.id}" ${isVisited ? 'checked' : ''}>
                        </td>`;

                    const actionsHtml = isReception
                        ? `<div class="action-container">
                                <button class="action-icon-btn edit-btn" data-id="${data.id}" title="Edit Appointment" ${isLocked ? 'disabled' : ''}>✏️</button>
                            </div>`
                        : `<div class="action-container">
                                <button class="action-icon-btn edit-btn" data-id="${data.id}" title="Edit Appointment">✏️</button>
                                <button class="action-icon-btn delete-btn" data-id="${data.id}" title="Delete Appointment">🗑️</button>
                            </div>`;

                    const lockedInputAttr = isLocked ? 'disabled' : '';

                    tr.innerHTML = `
                        ${doneCellHtml}
                        <td>${data.appointment_time || ''}</td>
                        <td>${data.patient_name || ''}</td>
                        <td>${data.patient_phone || ''}</td>
                        <td>${data.age || '--'}</td>
                        <td>${data.patient_address || '--'}</td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="payment" value="${data.payment || ''}" placeholder="Amount" min="0" ${lockedInputAttr}>
                        </td>
                        <td>
                            <select class="cell-select cell-select-action" data-id="${data.id}" data-field="payment_type" ${lockedInputAttr}>
                                <option value="" ${isTypeUnset}>--</option>
                                <option value="Online" ${isOnline}>Online</option>
                                <option value="Cash" ${isCash}>Cash</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" class="cell-input cell-action" data-id="${data.id}" data-field="reference" value="${data.reference || ''}" placeholder="..." ${lockedInputAttr}>
                        </td>
                        <td>
                            <input type="text" class="cell-input cell-action" data-id="${data.id}" data-field="diagnosis" value="${data.diagnosis || ''}" placeholder="..." ${lockedInputAttr}>
                        </td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="follow_up" value="${data.follow_up || ''}" placeholder="e.g. 7" min="0" ${lockedInputAttr}>
                        </td>
                        <td>
                            ${actionsHtml}
                        </td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="call_back" value="${data.call_back || ''}" placeholder="e.g. 7" min="0" ${lockedInputAttr}>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                let totalEarned = 0;
                let totalCash = 0;
                let totalOnline = 0;
                filteredDocs.forEach(data => {
                    const amount = Number(data.payment) || 0;
                    totalEarned += amount;
                    if (data.payment_type === 'Cash') {
                        totalCash += amount;
                    } else if (data.payment_type === 'Online') {
                        totalOnline += amount;
                    }
                });
                const revealWrap = document.getElementById('totalsRevealWrap');
                const revealCheckbox = document.getElementById('totalsRevealCheckbox');
                const todayStr = new Date().toISOString().split('T')[0];
                const isToday = dateFilter.value === todayStr;
                const receptionBlockedDay = userRole === 'reception' && !isToday;

                if (receptionBlockedDay) {
                    // Past (or future) totals are off-limits to reception entirely.
                    tableFooter.style.display = "none";
                } else if (userRole === 'reception') {
                    revealWrap.style.display = "inline-flex";
                    const amountsShown = revealCheckbox.checked;
                    if (amountsShown) {
                        totalEarnedEl.textContent = `₹${totalEarned.toLocaleString('en-IN')}`;
                        totalCashEl.textContent = `Cash ₹${totalCash.toLocaleString('en-IN')}`;
                        totalOnlineEl.textContent = `Online ₹${totalOnline.toLocaleString('en-IN')}`;
                    } else {
                        totalEarnedEl.textContent = "••••";
                        totalCashEl.textContent = "Cash ••••";
                        totalOnlineEl.textContent = "Online ••••";
                    }
                    revealCheckbox.onchange = syncAppointments;
                    tableFooter.style.display = "";
                } else {
                    revealWrap.style.display = "none";
                    totalEarnedEl.textContent = `₹${totalEarned.toLocaleString('en-IN')}`;
                    totalCashEl.textContent = `Cash ₹${totalCash.toLocaleString('en-IN')}`;
                    totalOnlineEl.textContent = `Online ₹${totalOnline.toLocaleString('en-IN')}`;
                    tableFooter.style.display = "";
                }

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const docId = e.target.getAttribute('data-id');
                        window.location.href = `create.html?editId=${docId}`;
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        if (confirm("Are you sure you want to permanently delete this appointment record?")) {
                            try {
                                await deleteDoc(doc(db, "appointments", docId));
                                console.log(`Successfully deleted record document: ${docId}`);
                            } catch (err) {
                                console.error("Firestore document erasure operation failed: ", err);
                            }
                        }
                    });
                });

                document.querySelectorAll('.status-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        const isChecked = e.target.checked;
                        const newStatus = isChecked ? 'Visited' : 'Booked';
                        const row = e.target.closest('tr');

                        if (isChecked) {
                            row.classList.add('completed-row');
                        } else {
                            row.classList.remove('completed-row');
                        }

                        try {
                            const docRef = doc(db, "appointments", docId);
                            await updateDoc(docRef, { status: newStatus });
                            console.log(`Updated database status to: ${newStatus}`);
                        } catch (err) {
                            console.error("Firestore status update failed: ", err);
                            if (isChecked) row.classList.remove('completed-row');
                            else row.classList.remove('completed-row');
                            e.target.checked = !isChecked;
                        }
                    });
                });

                document.querySelectorAll('.cell-action, .cell-select-action').forEach(element => {
                    const triggerEvent = element.tagName === 'SELECT' ? 'change' : 'blur';
                    
                    element.addEventListener(triggerEvent, async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        const fieldName = e.target.getAttribute('data-field');
                        let newValue = e.target.value;

                        if ((fieldName === 'payment' || fieldName === 'follow_up' || fieldName === 'call_back') && newValue !== "") {
                            newValue = Number(newValue);
                        }

                        try {
                            const docRef = doc(db, "appointments", docId);
                            const updatePayload = { [fieldName]: newValue };
                            if (fieldName === 'follow_up') {
                                // A new/changed follow-up value means new reminder dates —
                                // reset both flags so the WhatsApp reminder bot re-sends them.
                                updatePayload.follow_up_sent = false;
                                updatePayload.follow_up_day_before_sent = false;
                            }
                            await updateDoc(docRef, updatePayload);
                            console.log(`Updated database field [${fieldName}] to:`, newValue);
                        } catch (err) {
                            console.error("Firestore update failed: ", err);
                        }
                    });
                });
            });
        }

        function resetCounters() {
            totalEarnedEl.textContent = "₹0";
            totalCashEl.textContent = "Cash ₹0";
            totalOnlineEl.textContent = "Online ₹0";
        }

        function switchService(service) {
            if (activeService === service) return;
            activeService = service;
            
            if (activeService === 'Consultation') {
                consultationServiceBtn.classList.add('active');
                laserServiceBtn.classList.remove('active');
            } else {
                laserServiceBtn.classList.add('active');
                consultationServiceBtn.classList.remove('active');
            }
            syncAppointments();
        }

        function switchShift(shift) {
            if (activeShift === shift) return;
            activeShift = shift;
            
            if (activeShift === 'morning') {
                morningShiftBtn.classList.add('active');
                afternoonShiftBtn.classList.remove('active');
            } else {
                afternoonShiftBtn.classList.add('active');
                morningShiftBtn.classList.remove('active');
            }
            syncAppointments();
        }

        function shiftDay(offset) {
            const currentDate = new Date(dateFilter.value);
            currentDate.setDate(currentDate.getDate() + offset);
            dateFilter.value = currentDate.toISOString().split('T')[0];
            syncAppointments();
        }

        consultationServiceBtn.addEventListener('click', () => switchService('Consultation'));
        laserServiceBtn.addEventListener('click', () => switchService('Laser Hair Removal'));

        morningShiftBtn.addEventListener('click', () => switchShift('morning'));
        afternoonShiftBtn.addEventListener('click', () => switchShift('afternoon'));
        
        document.getElementById('prevDay').addEventListener('click', () => shiftDay(-1));
        document.getElementById('nextDay').addEventListener('click', () => shiftDay(1));
        dateFilter.addEventListener('change', syncAppointments);

        // Expose to the login script (this runs inside a module, which has its
        // own scope) and only start pulling data once someone is logged in.
        window.syncAppointments = syncAppointments;
        window.stopSync = () => { if (unsubscribe) unsubscribe(); };
        if (userRole) {
            syncAppointments();
        }
    </script>
</body>
</html>
