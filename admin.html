<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quando&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            background-color: #fcfaf9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .dashboard-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background: #ffffff;
            color: #49444c;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            flex-shrink: 0;
            border-bottom: 3px solid #87008c;
        }
        .navbar .logo {
            font-family: "Open Sans", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #3a3a3a;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        .nav-links a {
            color: #3a3a3a;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #87008c;
        }
        .nav-links .appointment-btn {
            background-color: #72bfba;
            color: #fff;
            padding: 9px 20px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            border: none;
        }
        .nav-links .appointment-btn:hover {
            background-color: #5aa9a4;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 19px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #3a3a3a;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid rgba(125,152,163,0.31);
            background: #fdfaf8;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
        }
        .service-select {
            font-family: "Quando", serif;
            font-size: 20px;
            font-weight: 400;
            color: #49444c;
            border: none;
            border-bottom: 2px solid #72bfba;
            padding: 5px 2px;
            outline: none;
            cursor: pointer;
            background: transparent;
        }
        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .arrow-btn {
            background: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            color: #49444c;
            transition: background-color 0.2s;
        }
        .arrow-btn:hover {
            background-color: #72bfba;
            color: #fff;
        }
        .date-input {
            font-family: "Open Sans", sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #49444c;
            border: 1px solid rgba(125,152,163,0.31);
            padding: 7px 12px;
            border-radius: 3px;
            text-align: center;
            background: #f5f2ea;
        }
        .create-btn {
            font-family: "Open Sans", sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #72bfba;
            border: none;
            border-radius: 3px;
            padding: 10px 22px;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            transition: background-color 0.2s;
        }
        .create-btn:hover {
            background-color: #5aa9a4;
        }
        .table-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .appointments-table {
            width: 100%;
            min-width: 1080px;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .appointments-table th, .appointments-table td {
            border: 1px solid rgba(125,152,163,0.31);
            padding: 14px 16px;
            text-align: left;
            font-size: 15px;
        }
        .appointments-table th {
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a7a7a;
            background-color: #fdfaf8;
        }
        .col-time { width: 8%; }
        .col-name { width: 15%; }
        .col-phone { width: 12%; }
        .col-payment { width: 10%; }
        .col-type { width: 10%; }
        .col-ref { width: 12%; }
        .col-diagnosis { width: 16%; }
        .col-callback { width: 8%; }
        .col-follow { width: 9%; }

        .cell-input, .cell-select {
            width: 100%;
            border: none;
            border-bottom: 1px dashed rgba(125,152,163,0.5);
            background: transparent;
            padding: 4px;
            font-size: 14px;
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            outline: none;
        }
        .cell-input:focus, .cell-select:focus {
            border-bottom: 1px solid #72bfba;
            background-color: #f5f2ea;
        }
        .no-data {
            text-align: center;
            padding: 50px;
            color: #7a7a7a;
            font-style: italic;
            font-size: 15px;
        }
        #tableFooter {
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        .totals-row td {
            position: sticky;
            bottom: 0;
            background-color: #f5f2ea;
            border-top: 2px solid #72bfba;
            font-family: "Open Sans", sans-serif;
            padding: 14px 16px;
        }
        .totals-label {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
            color: #49444c;
        }
        .totals-value {
            font-weight: 700;
            font-size: 15px;
            color: #2f7a5f;
            white-space: nowrap;
        }
        #totalBreakdown {
            white-space: nowrap;
        }
        .breakdown-divider {
            display: inline-block;
            margin: 0 12px;
            color: rgba(47, 122, 95, 0.4);
            font-weight: 400;
        }
        @media (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
                padding: 16px 20px;
                position: relative;
            }
            .navbar .logo { font-size: 17px; }
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                margin-top: 14px;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 12px 4px;
                border-top: 1px solid rgba(125,152,163,0.25);
                text-align: center;
                font-size: 15px;
            }
            .nav-links .appointment-btn {
                margin-top: 10px;
                text-align: center;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 16px 20px;
            }
            .service-select { text-align: center; }
            .date-picker-container { justify-content: center; }
            .create-btn { width: 100%; }
            .table-scroll-hint {
                display: block;
                text-align: center;
                font-size: 12px;
                color: #7a7a7a;
                padding: 8px 0 0;
                background: #fdfaf8;
            }
        }
        .table-scroll-hint { display: none; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="navbar">
            <div class="logo">Admin Dashboard</div>
            <button class="hamburger" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Site</a>
                <a href="appointment.html" class="appointment-btn">View Bookings Page</a>
            </div>
        </div>

        <div class="controls-bar">
            <select id="serviceFilter" class="service-select">
                <option value="Consultation">Consultation</option>
                <option value="Laser Hair Removal">Laser</option>
            </select>

            <div class="date-picker-container">
                <button class="arrow-btn" id="prevDay">&lt;</button>
                <input type="date" id="dateFilter" class="date-input">
                <button class="arrow-btn" id="nextDay">&gt;</button>
            </div>

            <button class="create-btn" onclick="window.location.href='create.html'">Create</button>
        </div>

        <div class="table-scroll-hint">← Swipe to see more columns →</div>
        <div class="table-wrapper">
            <table class="appointments-table">
                <thead>
                    <tr>
                        <th class="col-time">Time</th>
                        <th class="col-name">Name</th>
                        <th class="col-phone">Contact number</th>
                        <th class="col-payment">Payment</th>
                        <th class="col-type">Type</th>
                        <th class="col-ref">Reference</th>
                        <th class="col-diagnosis">Diagnosis</th>
                        <th class="col-callback">Call back</th>
                        <th class="col-follow">Follow up</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
                <tfoot id="tableFooter" style="display: none;">
                    <tr class="totals-row">
                        <td colspan="3" class="totals-label">Totals for the day</td>
                        <td id="totalEarned" class="totals-value">₹0</td>
                        <td colspan="2" id="totalBreakdown" class="totals-value">
                            <span id="totalCashText">Cash ₹0</span><span class="breakdown-divider">|</span><span id="totalOnlineText">Online ₹0</span>
                        </td>
                        <td colspan="3"></td>
                    </tr>
                </tfoot>
            </table>
            <div id="noDataMessage" class="no-data" style="display: none;">No appointments scheduled for this selection.</div>
        </div>
    </div>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDstFH1FUnW3YQVk-XUWC5rjMWuWxo5jjA",
            authDomain: "appointment-booking-1f0d0.firebaseapp.com",
            projectId: "appointment-booking-1f0d0",
            storageBucket: "appointment-booking-1f0d0.firebasestorage.app",
            messagingSenderId: "572909099522",
            appId: "1:572909099522:web:a40cb6dc7fafe8ea7e651b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const serviceFilter = document.getElementById('serviceFilter');
        const dateFilter = document.getElementById('dateFilter');
        const tableBody = document.getElementById('tableBody');
        const noDataMessage = document.getElementById('noDataMessage');
        const tableFooter = document.getElementById('tableFooter');
        const totalEarnedEl = document.getElementById('totalEarned');
        const totalCashEl = document.getElementById('totalCashText');
        const totalOnlineEl = document.getElementById('totalOnlineText');

        const today = new Date();
        dateFilter.value = today.toISOString().split('T')[0];

        let unsubscribe = null;

        function syncAppointments() {
            if (unsubscribe) unsubscribe();

            const selectedService = serviceFilter.value;
            const selectedDate = dateFilter.value;

            const q = query(
                collection(db, "appointments"),
                where("service_type", "==", selectedService),
                where("appointment_date", "==", selectedDate)
            );

            unsubscribe = onSnapshot(q, (snapshot) => {
                tableBody.innerHTML = "";
                
                if (snapshot.empty) {
                    noDataMessage.style.display = "block";
                    tableFooter.style.display = "none";
                    return;
                }
                noDataMessage.style.display = "none";

                const docs = [];
                snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
                docs.sort((a, b) => a.appointment_time.localeCompare(b.appointment_time));

                docs.forEach(data => {
                    const tr = document.createElement('tr');

                    // Payment Method Options Evaluator
                    const isOnline = data.payment_type === 'Online' ? 'selected' : '';
                    const isCash = data.payment_type === 'Cash' ? 'selected' : '';
                    const isTypeUnset = (!isOnline && !isCash) ? 'selected' : '';

                    tr.innerHTML = `
                        <td>${data.appointment_time || ''}</td>
                        <td>${data.patient_name || ''}</td>
                        <td>${data.patient_phone || ''}</td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="payment" value="${data.payment || ''}" placeholder="Amount" min="0">
                        </td>
                        <td>
                            <select class="cell-select cell-action" data-id="${data.id}" data-field="payment_type">
                                <option value="" ${isTypeUnset}>--</option>
                                <option value="Online" ${isOnline}>Online</option>
                                <option value="Cash" ${isCash}>Cash</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" class="cell-input cell-action" data-id="${data.id}" data-field="reference" value="${data.reference || ''}" placeholder="...">
                        </td>
                        <td>
                            <input type="text" class="cell-input cell-action" data-id="${data.id}" data-field="diagnosis" value="${data.diagnosis || ''}" placeholder="...">
                        </td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="call_back" value="${data.call_back || ''}" placeholder="e.g. 7" min="0">
                        </td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="follow_up" value="${data.follow_up || ''}" placeholder="e.g. 7" min="0">
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                // --- Calculate daily totals for the currently filtered service ---
                let totalEarned = 0;
                let totalCash = 0;
                let totalOnline = 0;
                docs.forEach(data => {
                    const amount = Number(data.payment) || 0;
                    totalEarned += amount;
                    if (data.payment_type === 'Cash') {
                        totalCash += amount;
                    } else if (data.payment_type === 'Online') {
                        totalOnline += amount;
                    }
                });
                totalEarnedEl.textContent = `₹${totalEarned.toLocaleString('en-IN')}`;
                totalCashEl.textContent = `Cash ₹${totalCash.toLocaleString('en-IN')}`;
                totalOnlineEl.textContent = `Online ₹${totalOnline.toLocaleString('en-IN')}`;
                tableFooter.style.display = "";

                // Global element intercept event binding engine
                document.querySelectorAll('.cell-action').forEach(element => {
                    const triggerEvent = element.tagName === 'SELECT' ? 'change' : 'blur';
                    
                    element.addEventListener(triggerEvent, async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        const fieldName = e.target.getAttribute('data-field');
                        let newValue = e.target.value;

                        // Force cast payment, follow_up, and call_back mutations to proper database Numbers
                        if ((fieldName === 'payment' || fieldName === 'follow_up' || fieldName === 'call_back') && newValue !== "") {
                            newValue = Number(newValue);
                        }

                        try {
                            const docRef = doc(db, "appointments", docId);
                            await updateDoc(docRef, {
                                [fieldName]: newValue
                            });
                            console.log(`Updated database field [${fieldName}] to:`, newValue);
                        } catch (err) {
                            console.error("Firestore update failed: ", err);
                        }
                    });
                });
            });
        }

        function shiftDay(offset) {
            const currentDate = new Date(dateFilter.value);
            currentDate.setDate(currentDate.getDate() + offset);
            dateFilter.value = currentDate.toISOString().split('T')[0];
            syncAppointments();
        }

        document.getElementById('prevDay').addEventListener('click', () => shiftDay(-1));
        document.getElementById('nextDay').addEventListener('click', () => shiftDay(1));
        serviceFilter.addEventListener('change', syncAppointments);
        dateFilter.addEventListener('change', syncAppointments);

        syncAppointments();
    </script>
</body>
</html>
