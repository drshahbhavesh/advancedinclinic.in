<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quando&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            background-color: #fcfaf9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .dashboard-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background: #ffffff;
            color: #49444c;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            flex-shrink: 0;
            border-bottom: 3px solid #87008c;
        }
        .navbar .logo {
            font-family: "Open Sans", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #3a3a3a;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        .nav-links a {
            color: #3a3a3a;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #87008c;
        }
        .nav-links .appointment-btn {
            background-color: #72bfba;
            color: #fff;
            padding: 9px 20px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            border: none;
        }
        .nav-links .appointment-btn:hover {
            background-color: #5aa9a4;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 19px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #3a3a3a;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        
        .controls-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid rgba(125,152,163,0.31);
            background: #fdfaf8;
            flex-shrink: 0;
            gap: 20px;
        }
        
        .controls-left {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
        }
        
        .controls-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
        }

        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .arrow-btn {
            background: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            color: #49444c;
            transition: background-color 0.2s;
        }
        .arrow-btn:hover {
            background-color: #72bfba;
            color: #fff;
        }
        .date-input {
            font-family: "Open Sans", sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #49444c;
            border: 1px solid rgba(125,152,163,0.31);
            padding: 7px 12px;
            border-radius: 3px;
            text-align: center;
            background: #f5f2ea;
        }
        
        .toggle-container {
            display: flex;
            background: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            padding: 2px;
            gap: 2px;
        }
        .toggle-btn {
            font-family: "Open Sans", sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #7a7a7a;
            background: transparent;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .toggle-btn.active {
            background: #72bfba;
            color: #fff;
        }

        .create-btn {
            font-family: "Open Sans", sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #72bfba;
            border: none;
            border-radius: 3px;
            padding: 10px 22px;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            transition: background-color 0.2s;
        }
        .create-btn:hover {
            background-color: #5aa9a4;
        }
        .table-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .appointments-table {
            width: 100%;
            min-width: 1180px;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .appointments-table th, .appointments-table td {
            border: 1px solid rgba(125,152,163,0.31);
            padding: 14px 16px;
            text-align: left;
            font-size: 15px;
        }
        .appointments-table th {
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a7a7a;
            background-color: #fdfaf8;
        }
        
        .col-done { width: 4%; text-align: center; }
        .col-time { width: 7%; }
        .col-name { width: 12%; }
        .col-phone { width: 10%; }
        .col-age { width: 5%; }
        .col-payment { width: 9%; }
        .col-type { width: 9%; }
        .col-ref { width: 11%; }
        .col-diagnosis { width: 13%; }
        .col-follow { width: 8%; }
        .col-callback { width: 7%; }
        .col-actions { width: 6%; text-align: center; } /* Column configuration sizing for actions */

        .completed-row {
            background-color: #e2f3ec !important;
        }
        .completed-row td {
            background-color: #e2f3ec !important;
        }

        .cell-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2f7a5f;
            display: block;
            margin: 0 auto;
        }

        .cell-input, .cell-select {
            width: 100%;
            border: none;
            border-bottom: 1px dashed rgba(125,152,163,0.5);
            background: transparent;
            padding: 4px;
            font-size: 14px;
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            outline: none;
        }
        .cell-input:focus, .cell-select:focus {
            border-bottom: 1px solid #72bfba;
            background-color: #f5f2ea;
        }
        
        /* Action buttons layout rules configuration */
        .action-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .action-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px;
            border-radius: 3px;
            transition: transform 0.1s ease;
        }
        .action-icon-btn:hover {
            transform: scale(1.2);
        }
        
        .no-data {
            text-align: center;
            padding: 50px;
            color: #7a7a7a;
            font-style: italic;
            font-size: 15px;
        }
        #tableFooter {
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        .totals-row td {
            position: sticky;
            bottom: 0;
            background-color: #f5f2ea;
            border-top: 2px solid #72bfba;
            font-family: "Open Sans", sans-serif;
            padding: 14px 16px;
        }
        .totals-label {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
            color: #49444c;
        }
        .totals-value {
            font-weight: 700;
            font-size: 15px;
            color: #2f7a5f;
            white-space: nowrap;
        }
        #totalBreakdown {
            white-space: nowrap;
        }
        .breakdown-divider {
            display: inline-block;
            margin: 0 12px;
            color: rgba(47, 122, 95, 0.4);
            font-weight: 400;
        }
        @media (max-width: 950px) {
            .controls-bar {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                padding: 16px 20px;
            }
            .controls-left, .controls-center, .controls-right {
                justify-content: center;
            }
            .create-btn { width: 100%; }
        }
        @media (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
                padding: 16px 20px;
                position: relative;
            }
            .navbar .logo { font-size: 17px; }
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                margin-top: 14px;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 12px 4px;
                border-top: 1px solid rgba(125,152,163,0.25);
                text-align: center;
                font-size: 15px;
            }
            .nav-links .appointment-btn {
                margin-top: 10px;
                text-align: center;
            }
            .table-scroll-hint {
                display: block;
                text-align: center;
                font-size: 12px;
                color: #7a7a7a;
                padding: 8px 0 0;
                background: #fdfaf8;
            }
        }
        .table-scroll-hint { display: none; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="navbar">
            <div class="logo">Admin Dashboard</div>
            <button class="hamburger" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Site</a>
                <a href="appointment.html" class="appointment-btn">View Bookings Page</a>
            </div>
        </div>

        <div class="controls-bar">
            <div class="controls-left">
                <div class="toggle-container">
                    <button class="toggle-btn active" id="consultationServiceBtn">Consultation</button>
                    <button class="toggle-btn" id="laserServiceBtn">Laser</button>
                </div>
            </div>

            <div class="controls-center">
                <div class="date-picker-container">
                    <button class="arrow-btn" id="prevDay">&lt;</button>
                    <input type="date" id="dateFilter" class="date-input">
                    <button class="arrow-btn" id="nextDay">&gt;</button>
                </div>
            </div>

            <div class="controls-right">
                <div class="toggle-container">
                    <button class="toggle-btn active" id="morningShiftBtn">Morning</button>
                    <button class="toggle-btn" id="afternoonShiftBtn">Afternoon</button>
                </div>
                <button class="create-btn" onclick="window.location.href='create.html'">Create</button>
            </div>
        </div>

        <div class="table-scroll-hint">← Swipe to see more columns →</div>
        <div class="table-wrapper">
            <table class="appointments-table">
                <thead>
                    <tr>
                        <th class="col-done" style="text-align: center;">Done</th>
                        <th class="col-time">Time</th>
                        <th class="col-name">Name</th>
                        <th class="col-phone">Contact number</th>
                        <th class="col-age">Age</th>
                        <th class="col-payment">Payment</th>
                        <th class="col-type">Type</th>
                        <th class="col-ref">Reference</th>
                        <th class="col-diagnosis">Diagnosis</th>
                        <th class="col-follow">Follow up</th>
                        <th class="col-callback">Call back</th>
                        <th class="col-actions" style="text-align: center;">Actions</th> <!-- Added Header -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
                <tfoot id="tableFooter" style="display: none;">
                    <tr class="totals-row">
                        <td colspan="5" class="totals-label">Totals for the day</td>
                        <td id="totalEarned" class="totals-value">₹0</td>
                        <td colspan="2" id="totalBreakdown" class="totals-value">
                            <span id="totalCashText">Cash ₹0</span><span class="breakdown-divider">|</span><span id="totalOnlineText">Online ₹0</span>
                        </td>
                        <td colspan="4"></td>
                    </tr>
                </tfoot>
            </table>
            <div id="noDataMessage" class="no-data" style="display: none;">No appointments scheduled for this selection.</div>
        </div>
    </div>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        // Added deleteDoc parameter into imports configuration framework
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDstFH1FUnW3YQVk-XUWC5rjMWuWxo5jjA",
            authDomain: "appointment-booking-1f0d0.firebaseapp.com",
            projectId: "appointment-booking-1f0d0",
            storageBucket: "appointment-booking-1f0d0.firebasestorage.app",
            messagingSenderId: "572909099522",
            appId: "1:572909099522:web:a40cb6dc7fafe8ea7e651b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dateFilter = document.getElementById('dateFilter');
        const tableBody = document.getElementById('tableBody');
        const noDataMessage = document.getElementById('noDataMessage');
        const tableFooter = document.getElementById('tableFooter');
        const totalEarnedEl = document.getElementById('totalEarned');
        const totalCashEl = document.getElementById('totalCashText');
        const totalOnlineEl = document.getElementById('totalOnlineText');

        const consultationServiceBtn = document.getElementById('consultationServiceBtn');
        const laserServiceBtn = document.getElementById('laserServiceBtn');
        let activeService = 'Consultation';

        const morningShiftBtn = document.getElementById('morningShiftBtn');
        const afternoonShiftBtn = document.getElementById('afternoonShiftBtn');
        let activeShift = 'morning'; 

        const today = new Date();
        dateFilter.value = today.toISOString().split('T')[0];

        let unsubscribe = null;

        function syncAppointments() {
            if (unsubscribe) unsubscribe();

            const selectedDate = dateFilter.value;

            const q = query(
                collection(db, "appointments"),
                where("service_type", "==", activeService),
                where("appointment_date", "==", selectedDate)
            );

            unsubscribe = onSnapshot(q, (snapshot) => {
                tableBody.innerHTML = "";
                
                if (snapshot.empty) {
                    noDataMessage.style.display = "block";
                    tableFooter.style.display = "none";
                    resetCounters();
                    return;
                }

                const allDocs = [];
                snapshot.forEach(doc => allDocs.push({ id: doc.id, ...doc.data() }));
                
                const filteredDocs = allDocs.filter(data => {
                    if (!data.appointment_time) return false;
                    const hour = parseInt(data.appointment_time.split(':')[0], 10);
                    
                    if (activeShift === 'morning') {
                        return hour < 15; 
                    } else {
                        return hour >= 15; 
                    }
                });

                if (filteredDocs.length === 0) {
                    noDataMessage.style.display = "block";
                    tableFooter.style.display = "none";
                    resetCounters();
                    return;
                }
                
                noDataMessage.style.display = "none";
                filteredDocs.sort((a, b) => a.appointment_time.localeCompare(b.appointment_time));

                filteredDocs.forEach(data => {
                    const tr = document.createElement('tr');
                    
                    const isVisited = data.status === 'Visited';
                    if (isVisited) {
                        tr.classList.add('completed-row');
                    }

                    const isOnline = data.payment_type === 'Online' ? 'selected' : '';
                    const isCash = data.payment_type === 'Cash' ? 'selected' : '';
                    const isTypeUnset = (!isOnline && !isCash) ? 'selected' : '';

                    // Injected actions block container at the row tail wrapper layout structure
                    tr.innerHTML = `
                        <td style="text-align: center;">
                            <input type="checkbox" class="cell-checkbox status-checkbox" data-id="${data.id}" ${isVisited ? 'checked' : ''}>
                        </td>
                        <td>${data.appointment_time || ''}</td>
                        <td>${data.patient_name || ''}</td>
                        <td>${data.patient_phone || ''}</td>
                        <td>${data.age || '--'}</td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="payment" value="${data.payment || ''}" placeholder="Amount" min="0">
                        </td>
                        <td>
                            <select class="cell-select cell-select-action" data-id="${data.id}" data-field="payment_type">
                                <option value="" ${isTypeUnset}>--</option>
                                <option value="Online" ${isOnline}>Online</option>
                                <option value="Cash" ${isCash}>Cash</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" class="cell-input cell-action" data-id="${data.id}" data-field="reference" value="${data.reference || ''}" placeholder="...">
                        </td>
                        <td>
                            <input type="text" class="cell-input cell-action" data-id="${data.id}" data-field="diagnosis" value="${data.diagnosis || ''}" placeholder="...">
                        </td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="follow_up" value="${data.follow_up || ''}" placeholder="e.g. 7" min="0">
                        </td>
                        <td>
                            <input type="number" class="cell-input cell-action" data-id="${data.id}" data-field="call_back" value="${data.call_back || ''}" placeholder="e.g. 7" min="0">
                        </td>
                        <td>
                            <div class="action-container">
                                <button class="action-icon-btn edit-btn" data-id="${data.id}" title="Edit Appointment">✏️</button>
                                <button class="action-icon-btn delete-btn" data-id="${data.id}" title="Delete Appointment">🗑️</button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                let totalEarned = 0;
                let totalCash = 0;
                let totalOnline = 0;
                filteredDocs.forEach(data => {
                    const amount = Number(data.payment) || 0;
                    totalEarned += amount;
                    if (data.payment_type === 'Cash') {
                        totalCash += amount;
                    } else if (data.payment_type === 'Online') {
                        totalOnline += amount;
                    }
                });
                totalEarnedEl.textContent = `₹${totalEarned.toLocaleString('en-IN')}`;
                totalCashEl.textContent = `Cash ₹${totalCash.toLocaleString('en-IN')}`;
                totalOnlineEl.textContent = `Online ₹${totalOnline.toLocaleString('en-IN')}`;
                tableFooter.style.display = "";

                // Intercept logic configuration mapping for dynamic Edit and Delete triggers
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const docId = e.target.getAttribute('data-id');
                        // In a real application workflow environment configuration setup, 
                        // you can pass the parameter along via query parameters to create.html:
                        window.location.href = `create.html?editId=${docId}`;
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        if (confirm("Are you sure you want to permanently delete this appointment record?")) {
                            try {
                                await deleteDoc(doc(db, "appointments", docId));
                                console.log(`Successfully deleted record document: ${docId}`);
                            } catch (err) {
                                console.error("Firestore document erasure operation failed: ", err);
                            }
                        }
                    });
                });

                document.querySelectorAll('.status-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        const isChecked = e.target.checked;
                        const newStatus = isChecked ? 'Visited' : 'Booked';
                        const row = e.target.closest('tr');

                        if (isChecked) {
                            row.classList.add('completed-row');
                        } else {
                            row.classList.remove('completed-row');
                        }

                        try {
                            const docRef = doc(db, "appointments", docId);
                            await updateDoc(docRef, { status: newStatus });
                            console.log(`Updated database status to: ${newStatus}`);
                        } catch (err) {
                            console.error("Firestore status update failed: ", err);
                            if (isChecked) row.classList.remove('completed-row');
                            else row.classList.add('completed-row');
                            e.target.checked = !isChecked;
                        }
                    });
                });

                document.querySelectorAll('.cell-action, .cell-select-action').forEach(element => {
                    const triggerEvent = element.tagName === 'SELECT' ? 'change' : 'blur';
                    
                    element.addEventListener(triggerEvent, async (e) => {
                        const docId = e.target.getAttribute('data-id');
                        const fieldName = e.target.getAttribute('data-field');
                        let newValue = e.target.value;

                        if ((fieldName === 'payment' || fieldName === 'follow_up' || fieldName === 'call_back') && newValue !== "") {
                            newValue = Number(newValue);
                        }

                        try {
                            const docRef = doc(db, "appointments", docId);
                            await updateDoc(docRef, {
                                [fieldName]: newValue
                            });
                            console.log(`Updated database field [${fieldName}] to:`, newValue);
                        } catch (err) {
                            console.error("Firestore update failed: ", err);
                        }
                    });
                });
            });
        }

        function resetCounters() {
            totalEarnedEl.textContent = "₹0";
            totalCashEl.textContent = "Cash ₹0";
            totalOnlineEl.textContent = "Online ₹0";
        }

        function switchService(service) {
            if (activeService === service) return;
            activeService = service;
            
            if (activeService === 'Consultation') {
                consultationServiceBtn.classList.add('active');
                laserServiceBtn.classList.remove('active');
            } else {
                laserServiceBtn.classList.add('active');
                consultationServiceBtn.classList.remove('active');
            }
            syncAppointments();
        }

        function switchShift(shift) {
            if (activeShift === shift) return;
            activeShift = shift;
            
            if (activeShift === 'morning') {
                morningShiftBtn.classList.add('active');
                afternoonShiftBtn.classList.remove('active');
            } else {
                afternoonShiftBtn.classList.add('active');
                morningShiftBtn.classList.remove('active');
            }
            syncAppointments();
        }

        function shiftDay(offset) {
            const currentDate = new Date(dateFilter.value);
            currentDate.setDate(currentDate.getDate() + offset);
            dateFilter.value = currentDate.toISOString().split('T')[0];
            syncAppointments();
        }

        consultationServiceBtn.addEventListener('click', () => switchService('Consultation'));
        laserServiceBtn.addEventListener('click', () => switchService('Laser Hair Removal'));

        morningShiftBtn.addEventListener('click', () => switchShift('morning'));
        afternoonShiftBtn.addEventListener('click', () => switchShift('afternoon'));
        
        document.getElementById('prevDay').addEventListener('click', () => shiftDay(-1));
        document.getElementById('nextDay').addEventListener('click', () => shiftDay(1));
        dateFilter.addEventListener('change', syncAppointments);

        syncAppointments();
    </script>
</body>
</html>
