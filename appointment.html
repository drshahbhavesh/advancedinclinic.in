<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Advanced Skin Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quando&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: "Open Sans", sans-serif;
            color: #7a7a7a;
            background-color: #fcfaf9;
            background-image: linear-gradient(60deg, #fff6f4 0%, #ffe4e2 100%);
            min-height: 100vh;
        }

        /* ---------- Header ---------- */
        .site-header {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 35px;
            border-bottom: 3px solid #87008c;
        }
        .site-header .logo {
            font-family: "Open Sans", sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #3a3a3a;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #3a3a3a;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #87008c;
        }
        .nav-links .appointment-btn {
            background-color: #72bfba;
            color: #fff !important;
            padding: 10px 22px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .nav-links .appointment-btn:hover {
            background-color: #5aa9a4;
            color: #fff !important;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 19px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #3a3a3a;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* ---------- Page content ---------- */
        .form-content-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        .mockup-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 48px 55px;
            border-radius: 4px;
            box-shadow: -12px 12px 57px 10px rgba(143,158,170,0.14);
        }
        .card-eyebrow {
            text-align: center;
            font-family: "Open Sans", sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #cc9955;
            margin-bottom: 10px;
        }
        h2 {
            font-family: "Quando", serif;
            font-weight: 400;
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-align: center;
            color: #49444c;
        }
        .card-subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #7a7a7a;
            margin-bottom: 35px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .form-label {
            width: 140px;
            font-size: 16px;
            color: #49444c;
            font-weight: 600;
        }
        .form-field-wrapper {
            flex-grow: 1;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .input-box {
            width: 100%;
            background-color: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            padding: 11px 14px;
            font-size: 15px;
            font-family: "Open Sans", sans-serif;
            outline: none;
            color: #49444c;
        }
        .input-box:focus {
            border-color: #72bfba;
        }
        .input-box option:disabled {
            color: #b0b0b0;
            background-color: #f0f0f0;
        }
        .submit-btn-row {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
        .btn-submit {
            padding: 14px 34px;
            font-size: 1rem;
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            background-color: #72bfba;
            color: #fff;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #5aa9a4;
        }
        @media (max-width: 600px) {
            html, body {
                height: 100dvh;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            .site-header {
                flex-wrap: wrap;
                flex-shrink: 0;
                padding: 1.6vh 4vw;
                position: relative;
            }
            .site-header .logo { font-size: 4.6vw; }
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                margin-top: 1.6vh;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 1.4vh 4px;
                border-top: 1px solid rgba(125,152,163,0.25);
                text-align: center;
                font-size: 14px;
            }
            .nav-links .appointment-btn {
                margin-top: 1vh;
                text-align: center;
            }
            .form-content-area {
                flex: 1 1 auto;
                min-height: 0;
                overflow: hidden;
                padding: 1.6vh 4vw;
                display: flex;
                align-items: stretch;
                justify-content: center;
            }
            .mockup-card {
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 2.4vh 6vw;
                box-shadow: none;
            }
            .card-eyebrow {
                flex-shrink: 0;
                font-size: clamp(10px, 1.8vh, 12px);
                letter-spacing: 1.5px;
                margin-bottom: clamp(4px, 0.8vh, 8px);
            }
            h2 {
                flex-shrink: 0;
                font-size: clamp(19px, 3.6vh, 25px);
                line-height: 1.15;
                margin-bottom: clamp(3px, 0.6vh, 6px);
            }
            .card-subtitle {
                flex-shrink: 0;
                font-size: clamp(11px, 1.9vh, 13px);
                margin-bottom: clamp(10px, 2vh, 18px);
            }
            #appointmentForm {
                flex: 0 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: clamp(9px, 1.8vh, 16px);
            }
            .form-row {
                flex-direction: column;
                align-items: flex-start;
                gap: clamp(3px, 0.7vh, 6px);
                margin-bottom: 0;
            }
            .form-label {
                width: auto;
                font-size: clamp(13px, 2.1vh, 15px);
                font-weight: 600;
            }
            .form-field-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: clamp(6px, 1.1vh, 10px);
                width: 100%;
            }
            .form-field-wrapper input,
            .form-field-wrapper select {
                width: 100% !important;
            }
            .input-box {
                padding: clamp(9px, 1.6vh, 12px) 12px;
                font-size: clamp(13px, 2vh, 15px);
            }
            .submit-btn-row {
                justify-content: stretch;
                margin-top: clamp(2px, 0.5vh, 4px);
            }
            .btn-submit {
                width: 100%;
                padding: clamp(11px, 2vh, 15px) 20px;
                font-size: clamp(13px, 2vh, 15px);
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">Advanced Skin Clinic</a>
        <button class="hamburger" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="index.html">About Us</a>
            <a href="index.html">Blog</a>
            <a href="index.html">Tele-Dermatology</a>
            <a href="index.html">Contact Us</a>
            <a href="appointment.html" class="appointment-btn">Appointment</a>
        </div>
    </header>

        <div class="form-content-area">
            <div class="mockup-card">
                <h2>Schedule Your Appointment</h2>
                <form id="appointmentForm">
                    <br>
                    
                    <div class="form-row">
                        <label for="service" class="form-label">Service</label>
                        <div class="form-field-wrapper">
                            <select id="service" class="input-box" required>
                                <option value="" disabled selected>-- Choose a Service --</option>
                                <option value="Consultation">Consultation</option>
                                <option value="Laser Hair Removal">Laser Hair Removal</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="name" class="form-label">Name</label>
                        <div class="form-field-wrapper">
                            <input type="text" id="name" class="input-box" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="phone" class="form-label">Number</label>
                        <div class="form-field-wrapper">
                            <input type="tel" id="phone" class="input-box" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Schedule</label>
                        <div class="form-field-wrapper">
                            <input type="date" id="date" class="input-box" required style="width: 50%;">
                            <select id="time" class="input-box" required style="width: 50%;">
                                <option value="" disabled selected>-- Select Time --</option>
                            </select>
                        </div>
                    </div>

                    <div class="submit-btn-row">
                        <button type="submit" class="btn-submit">Confirm Appointment</button>
                    </div>
                </form>
            </div>
        </div>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { reassignDailyTokens, countStillWaitingAhead } from "./token-utils.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDstFH1FUnW3YQVk-XUWC5rjMWuWxo5jjA",
            authDomain: "appointment-booking-1f0d0.firebaseapp.com",
            projectId: "appointment-booking-1f0d0",
            storageBucket: "appointment-booking-1f0d0.firebasestorage.app",
            messagingSenderId: "572909099522",
            appId: "1:572909099522:web:a40cb6dc7fafe8ea7e651b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const serviceInput = document.getElementById('service');
        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');

        // --- RESTRICT DATE TO TOMORROW OR LATER ---
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        const yyyy = tomorrow.getFullYear();
        const mm = String(tomorrow.getMonth() + 1).padStart(2, '0'); 
        const dd = String(tomorrow.getDate()).padStart(2, '0');
        dateInput.min = `${yyyy}-${mm}-${dd}`;
        dateInput.value = `${yyyy}-${mm}-${dd}`; // Pre-select tomorrow automatically

        // --- GENERATE AND SYNC SLOT CONFLICTS ---
        // Laser Hair Removal uses 60-minute slots; Consultation (and anything else) uses 15-minute slots
        function generateTimeSlots(service) {
            const interval = service === 'Laser Hair Removal' ? 60 : 15;
            const slots = [];
            for (let hour = 9; hour < 18; hour++) {
                for (let min = 0; min < 60; min += interval) {
                    const hh = String(hour).padStart(2, '0');
                    const mm = String(min).padStart(2, '0');
                    slots.push(`${hh}:${mm}`);
                }
            }
            return slots;
        }

        let unsubscribeSlots = null;

        function updateAvailableTimeSlots() {
            if (unsubscribeSlots) unsubscribeSlots();

            const selectedService = serviceInput.value;
            const selectedDate = dateInput.value;

            if (!selectedService || !selectedDate) return;

            const timeSlots = generateTimeSlots(selectedService);

            const q = query(
                collection(db, "appointments"),
                where("service_type", "==", selectedService),
                where("appointment_date", "==", selectedDate)
            );

            unsubscribeSlots = onSnapshot(q, (snapshot) => {
                const bookedTimes = new Set();
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.appointment_time) {
                        bookedTimes.add(data.appointment_time);
                    }
                });

                const currentSelection = timeSelect.value;
                timeSelect.innerHTML = '<option value="" disabled selected>-- Select Time --</option>';

                timeSlots.forEach(slot => {
                    const option = document.createElement('option');
                    option.value = slot;
                    option.textContent = slot;

                    if (bookedTimes.has(slot)) {
                        option.disabled = true;
                        option.textContent += ' (Booked)';
                    }
                    timeSelect.appendChild(option);
                });

                if (currentSelection && !bookedTimes.has(currentSelection)) {
                    timeSelect.value = currentSelection;
                }
            });
        }

        serviceInput.addEventListener('change', updateAvailableTimeSlots);
        dateInput.addEventListener('change', updateAvailableTimeSlots);

        // --- HANDLE FORM SUBMISSION ---
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const service = serviceInput.value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = dateInput.value;
            const time = timeSelect.value;

            try {
                // Combined single transaction layout schema payload tracking
                const newDocRef = await addDoc(collection(db, "appointments"), {
                    service_type: service,
                    patient_name: name,
                    patient_phone: phone,
                    appointment_date: date,
                    appointment_time: time,
                    status: "Booked",
                    entry_source: "online",
                    createdAt: new Date(),
                    whatsapp_sent: false, // picked up by the WhatsApp notifier bot
                    // Placeholders prevent structural query errors on admin data loops
                    payment: "", 
                    payment_type: "",
                    reference: "",
                    follow_up: ""
                });

                // Join the shared, time-ordered token queue for this service+date.
                const dayEntries = await reassignDailyTokens(db, service, date);
                const mine = dayEntries.find(e => e.id === newDocRef.id);
                const tokenNumber = mine ? mine.token_number : '';
                const aheadCount = mine ? countStillWaitingAhead(dayEntries, newDocRef.id) : '';

                const params = new URLSearchParams({
                    name: name,
                    date: date,
                    time: time,
                    service: service,
                    token: tokenNumber,
                    ahead: aheadCount
                });
                window.location.href = `confirmation.html?${params.toString()}`;
            } catch (error) {
                console.error("Error writing to cloud database: ", error);
                alert("Something went wrong. Please try again.");
            }
        });
    </script>
</body>
</html>
