<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Appointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quando&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: "Open Sans", sans-serif;
            color: #49444c;
            background-color: #fcfaf9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .dashboard-container {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            background: #ffffff;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            flex-shrink: 0;
            border-bottom: 3px solid #87008c;
        }
        .navbar .logo {
            font-family: "Open Sans", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #3a3a3a;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        .nav-links a {
            color: #3a3a3a;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #87008c;
        }
        .nav-links .appointment-btn {
            background-color: #72bfba;
            color: #fff;
            padding: 9px 20px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            border: none;
        }
        .nav-links .appointment-btn:hover {
            background-color: #5aa9a4;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 19px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #3a3a3a;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .form-content-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
            background: #fdfaf8;
        }
        .mockup-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 45px 50px;
            border-radius: 4px;
            box-shadow: -12px 12px 57px 10px rgba(143,158,170,0.14);
            position: relative;
        }
        .card-title {
            font-family: "Quando", serif;
            font-weight: 400;
            font-size: 1.8rem;
            color: #49444c;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .form-label {
            width: 140px;
            font-size: 15px;
            color: #49444c;
            font-weight: 600;
        }
        .form-field-wrapper {
            flex-grow: 1;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .input-box {
            width: 100%;
            background-color: #f5f2ea;
            border: 1px solid rgba(125,152,163,0.31);
            border-radius: 3px;
            padding: 10px 14px;
            font-size: 15px;
            font-family: "Open Sans", sans-serif;
            outline: none;
            color: #49444c;
            height: 43px;
        }
        .input-box:focus {
            border-color: #72bfba;
        }
        .input-box option:disabled {
            color: #b0b0b0;
            background-color: #f0f0f0;
        }
        .size-short {
            width: 90px;
            flex-grow: 0;
        }
        .inline-label {
            font-size: 15px;
            font-weight: 600;
            color: #49444c;
            margin-left: 5px;
            margin-right: 5px;
        }
        .status-toast {
            font-size: 13px;
            color: #4a8f6b;
            font-weight: 600;
            margin-top: -15px;
            margin-left: 140px;
            margin-bottom: 15px;
            display: none;
        }
        .submit-btn-row {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }
        .btn {
            padding: 12px 28px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            font-family: "Open Sans", sans-serif;
            transition: background-color 0.2s;
        }
        .btn-cancel {
            background-color: #f0ece5;
            color: #7a7a7a;
        }
        .btn-cancel:hover {
            background-color: #e5e0d7;
        }
        .btn-submit {
            background-color: #72bfba;
            color: #fff;
        }
        .btn-submit:hover {
            background-color: #5aa9a4;
        }
        hr {
            border: 0;
            border-top: 1px solid rgba(125,152,163,0.31) !important;
        }
        @media (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
                padding: 16px 20px;
                position: relative;
            }
            .navbar .logo { font-size: 17px; }
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                margin-top: 14px;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 12px 4px;
                border-top: 1px solid rgba(125,152,163,0.25);
                text-align: center;
                font-size: 15px;
            }
            .nav-links .appointment-btn {
                margin-top: 10px;
                text-align: center;
            }
        }
        @media (max-width: 600px) {
            .form-content-area { padding: 30px 14px; }
            .mockup-card { padding: 30px 20px; }
            .card-title { font-size: 1.5rem; }
            .form-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                margin-bottom: 16px;
            }
            .form-label { width: auto; }
            .form-field-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                width: 100%;
            }
            .form-field-wrapper input,
            .form-field-wrapper select {
                width: 100% !important;
            }
            .size-short { width: 100% !important; }
            .inline-label { margin-left: 0; }
            .status-toast { margin-left: 0; }
            .submit-btn-row {
                flex-direction: column-reverse;
                gap: 10px;
            }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="navbar">
            <div class="logo" id="navLogo">Admin Create</div>
            <button class="hamburger" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="admin.html">Dashboard</a>
                <a href="appointment.html" class="appointment-btn">View Bookings Page</a>
            </div>
        </div>

        <div class="form-content-area">
            <div class="mockup-card">
                <div class="card-title" id="formTitle">Create Appointment</div>
                <form id="createAppointmentForm">
                    
                    <div class="form-row">
                        <label class="form-label">Service</label>
                        <div class="form-field-wrapper">
                            <select id="service" class="input-box" required>
                                <option value="Consultation">Consultation</option>
                                <option value="Laser Hair Removal">Laser Hair Removal</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Schedule</label>
                        <div class="form-field-wrapper" style="flex-direction: column; align-items: stretch; gap: 8px;">
                            <div style="display: flex; gap: 15px; width: 100%; align-items: center;">
                                <input type="date" id="appDate" class="input-box" required style="width: 50%;">
                                <select id="appTimeMode" class="input-box" required style="width: 50%;">
                                    <option value="AUTO" selected>Auto (Next Free Slot)</option>
                                    <option value="MANUAL">⚙️ Manual Time Selection</option>
                                </select>
                            </div>
                            <input type="time" id="customTimeInput" class="input-box" style="display: none; border-color: #72bfba; background-color: #fafcfb;">
                        </div>
                    </div>

                    <hr style="border: 0; border-top: 1px solid rgba(125,152,163,0.31); margin-bottom: 20px;">

                    <div class="form-row">
                        <label for="phone" class="form-label">Number</label>
                        <div class="form-field-wrapper">
                            <input type="tel" id="phone" class="input-box" placeholder="Enter number to lookup..." required inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                    </div>
                    <div id="lookupStatus" class="status-toast">Returning patient data auto-populated!</div>

                    <div class="form-row">
                        <label for="name" class="form-label">Name</label>
                        <div class="form-field-wrapper">
                            <select id="nameSelector" class="input-box" style="display: none; border-color: #87008c; background-color: #fbf5fc;">
                                <option value="" disabled selected>-- Multiple Patients Found! Select Name --</option>
                            </select>
                            <input type="text" id="name" class="input-box" required autocapitalize="words">
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="age" class="form-label">Age</label>
                        <div class="form-field-wrapper">
                            <input type="number" id="age" class="input-box size-short" min="0">
                            
                            <span class="inline-label">Gender</span>
                            <select id="gender" class="input-box" style="flex-grow: 1;">
                                <option value="">--</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="payment" class="form-label">Payment</label>
                        <div class="form-field-wrapper">
                            <input type="number" id="payment" class="input-box" placeholder="Amount" min="0" style="width: 40%;">
                            <select id="paymentType" class="input-box" style="width: 60%;">
                                <option value="">-- Method --</option>
                                <option value="Online">Online</option>
                                <option value="Cash">Cash</option>
                            </select>
                        </div>
                    </div>

                    <!-- Repositioned: Address Row now lives directly below Payment and above Reference -->
                    <div class="form-row">
                        <label for="address" class="form-label">Address</label>
                        <div class="form-field-wrapper">
                            <input type="text" id="address" class="input-box">
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="reference" class="form-label">Reference</label>
                        <div class="form-field-wrapper">
                            <input type="text" id="reference" class="input-box">
                        </div>
                    </div>

                    <div class="submit-btn-row">
                        <button type="button" class="btn btn-cancel" onclick="window.history.back()">Cancel</button>
                        <button type="submit" id="submitBtn" class="btn btn-submit">Create Appointment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, query, where, onSnapshot, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDstFH1FUnW3YQVk-XUWC5rjMWuWxo5jjA",
            authDomain: "appointment-booking-1f0d0.firebaseapp.com",
            projectId: "appointment-booking-1f0d0",
            storageBucket: "appointment-booking-1f0d0.firebasestorage.app",
            messagingSenderId: "572909099522",
            appId: "1:572909099522:web:a40cb6dc7fafe8ea7e651b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const serviceInput = document.getElementById('service');
        const dateInput = document.getElementById('appDate');
        const timeModeSelect = document.getElementById('appTimeMode');
        const customTimeInput = document.getElementById('customTimeInput');
        const phoneInput = document.getElementById('phone');
        const nameInput = document.getElementById('name');
        const addressInput = document.getElementById('address');
        const nameSelector = document.getElementById('nameSelector');
        const lookupStatus = document.getElementById('lookupStatus');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const navLogo = document.getElementById('navLogo');

        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('editId');

        // Formats a Date object as a YYYY-MM-DD string using its LOCAL calendar date.
        // We avoid Date#toISOString() here since it converts to UTC first — for
        // timezones ahead of UTC (like India, UTC+5:30), a local midnight timestamp
        // can roll back into the previous UTC day, defaulting this field to yesterday.
        function toLocalDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        dateInput.value = toLocalDateStr(new Date());

        let bookedTimesSet = new Set();

        function generateTimeSlots(service) {
            const interval = service === 'Laser Hair Removal' ? 60 : 10;
            const slots = [];
            
            // Shift 1: 10:00 AM to 2:00 PM (14:00)
            for (let hour = 10; hour <= 14; hour++) {
                for (let min = 0; min < 60; min += interval) {
                    if (hour === 14 && min > 0) continue;
                    slots.push(`${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`);
                }
            }
            
            // Shift 2: 4:00 PM (16:00) to 9:00 PM (21:00)
            for (let hour = 16; hour <= 21; hour++) {
                for (let min = 0; min < 60; min += interval) {
                    if (hour === 21 && min > 0) continue;
                    slots.push(`${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`);
                }
            }
            return slots;
        }

        let unsubscribeSlots = null;

        function monitorBookedSlots() {
            if (unsubscribeSlots) unsubscribeSlots();

            const selectedService = serviceInput.value;
            const selectedDate = dateInput.value;

            if (!selectedService || !selectedDate) return;

            const q = query(
                collection(db, "appointments"),
                where("service_type", "==", selectedService),
                where("appointment_date", "==", selectedDate)
            );

            unsubscribeSlots = onSnapshot(q, (snapshot) => {
                bookedTimesSet.clear();
                snapshot.forEach((doc) => {
                    if (doc.id !== editId) {
                        const data = doc.data();
                        if (data.appointment_time) {
                            bookedTimesSet.add(data.appointment_time);
                        }
                    }
                });
            });
        }

        timeModeSelect.addEventListener('change', (e) => {
            if (e.target.value === "MANUAL") {
                customTimeInput.style.display = "block";
                customTimeInput.setAttribute('required', 'true');
            } else {
                customTimeInput.style.display = "none";
                customTimeInput.removeAttribute('required');
                customTimeInput.value = "";
            }
        });

        serviceInput.addEventListener('change', monitorBookedSlots);
        dateInput.addEventListener('change', monitorBookedSlots);

        async function checkEditMode() {
            if (!editId) {
                monitorBookedSlots();
                return;
            }

            formTitle.textContent = "Edit Appointment";
            navLogo.textContent = "Admin Edit";
            submitBtn.textContent = "Update Appointment";

            try {
                const docRef = doc(db, "appointments", editId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    serviceInput.value = data.service_type || "Consultation";
                    dateInput.value = data.appointment_date || "";
                    phoneInput.value = data.patient_phone || "";
                    nameInput.value = data.patient_name || "";
                    addressInput.value = data.patient_address || ""; 
                    document.getElementById('age').value = data.age || "";
                    document.getElementById('gender').value = data.gender || "";
                    document.getElementById('payment').value = data.payment || "";
                    document.getElementById('paymentType').value = data.payment_type || "";
                    document.getElementById('reference').value = data.reference || "";

                    monitorBookedSlots();

                    if (data.appointment_time) {
                        timeModeSelect.value = "MANUAL";
                        customTimeInput.style.display = "block";
                        customTimeInput.setAttribute('required', 'true');
                        customTimeInput.value = data.appointment_time;
                    }
                } else {
                    alert("Requested appointment record not found.");
                    window.location.href = "admin.html";
                }
            } catch (err) {
                console.error("Error loading document for editing: ", err);
            }
        }

        let matchedPatientsMap = {};

        function populateFormFields(record) {
            nameInput.value = record.patient_name || "";
            addressInput.value = record.patient_address || ""; // Auto-populates historical address
            document.getElementById('age').value = record.age || "";
            document.getElementById('gender').value = record.gender || "";
            
            if (record.appointment_date) {
                const dateParts = record.appointment_date.split('-');
                if (dateParts.length === 3) {
                    const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;
                    document.getElementById('reference').value = `Last visit: ${formattedDate}`;
                } else {
                    document.getElementById('reference').value = `Last visit: ${record.appointment_date}`;
                }
            } else {
                document.getElementById('reference').value = "";
            }
            
            lookupStatus.style.display = "block";
            lookupStatus.style.opacity = '1';
            setTimeout(() => { lookupStatus.style.opacity = '0.5'; }, 3000);
        }

        function clearAutoPopulatedFields() {
            nameInput.value = "";
            nameInput.style.display = "block"; 
            nameSelector.style.display = "none";
            addressInput.value = "";
            document.getElementById('age').value = "";
            document.getElementById('gender').value = "";
            document.getElementById('reference').value = "";
            lookupStatus.style.display = "none";
            nameSelector.innerHTML = '<option value="" disabled selected>-- Multiple Patients Found! Select Name --</option>';
            matchedPatientsMap = {};
        }

        phoneInput.addEventListener('input', async (e) => {
            if (editId) return; 
            const phoneNumber = e.target.value.trim();

            if (phoneNumber.length >= 10) {
                try {
                    const q = query(
                        collection(db, "appointments"),
                        where("patient_phone", "==", phoneNumber),
                        orderBy("createdAt", "desc"),
                        limit(20)
                    );

                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        matchedPatientsMap = {};
                        
                        querySnapshot.forEach(doc => {
                            const data = doc.data();
                            const nameKey = (data.patient_name || "").trim();
                            if (nameKey && !matchedPatientsMap[nameKey]) {
                                matchedPatientsMap[nameKey] = data;
                            }
                        });

                        const uniqueNames = Object.keys(matchedPatientsMap);

                        if (uniqueNames.length === 1) {
                            nameSelector.style.display = "none";
                            nameInput.style.display = "block";
                            populateFormFields(matchedPatientsMap[uniqueNames[0]]);
                        } else if (uniqueNames.length > 1) {
                            nameSelector.innerHTML = '<option value="" disabled selected>-- Multiple Patients Found! Select Name --</option>';
                            uniqueNames.forEach(name => {
                                const opt = document.createElement('option');
                                opt.value = name;
                                opt.textContent = name;
                                nameSelector.appendChild(opt);
                            });
                            
                            nameInput.style.display = "none"; 
                            nameSelector.style.display = "block"; 
                            
                            nameInput.value = "";
                            addressInput.value = "";
                            document.getElementById('age').value = "";
                            document.getElementById('gender').value = "";
                            document.getElementById('reference').value = "";
                            lookupStatus.style.display = "none";
                        }
                    } else {
                        clearAutoPopulatedFields();
                    }
                } catch (err) {
                    console.error("Historical dynamic data group check fetch failed: ", err);
                }
            } else {
                clearAutoPopulatedFields();
            }
        });

        nameSelector.addEventListener('change', (e) => {
            const selectedName = e.target.value;
            if (selectedName && matchedPatientsMap[selectedName]) {
                nameSelector.style.display = "none";
                nameInput.style.display = "block";
                populateFormFields(matchedPatientsMap[selectedName]);
            }
        });

        nameInput.addEventListener('blur', (e) => {
            let value = e.target.value.trim();
            if (value) {
                e.target.value = value
                    .split(/\s+/)
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                    .join(' ');
            }
        });

        document.getElementById('createAppointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const serviceType = serviceInput.value;
            const appointmentDate = dateInput.value;
            
            let appointmentTime = "";
            if (timeModeSelect.value === "MANUAL") {
                appointmentTime = customTimeInput.value.trim();
            } else {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMin = now.getMinutes();
                const currentFormattedTime = `${String(currentHour).padStart(2, '0')}:${String(currentMin).padStart(2, '0')}`;

                const allSlots = generateTimeSlots(serviceType);
                const availableSlots = allSlots.filter(slot => !bookedTimesSet.has(slot));

                let computedSlot = availableSlots.find(slotTime => slotTime >= currentFormattedTime);

                if (!computedSlot && availableSlots.length > 0) {
                    computedSlot = availableSlots[0];
                }

                if (computedSlot) {
                    appointmentTime = computedSlot;
                } else {
                    alert("No remaining available time slots found for this date. Please enter a time manually.");
                    return;
                }
            }

            const name = nameInput.value;
            const phone = phoneInput.value;
            const address = addressInput.value.trim();
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            
            const payment = document.getElementById('payment').value;
            const paymentType = document.getElementById('paymentType').value;
            const reference = document.getElementById('reference').value;

            const appointmentPayload = {
                service_type: serviceType,
                appointment_date: appointmentDate,
                appointment_time: appointmentTime,
                patient_name: name,
                patient_phone: phone,
                patient_address: address, 
                age: age ? Number(age) : "",
                gender: gender,
                payment: payment ? Number(payment) : "", 
                payment_type: paymentType,
                reference: reference
            };

            try {
                if (editId) {
                    const docRef = doc(db, "appointments", editId);
                    await updateDoc(docRef, appointmentPayload);
                    alert("Appointment updated successfully!");
                    window.location.href = "admin.html";
                } else {
                    await addDoc(collection(db, "appointments"), {
                        ...appointmentPayload,
                        follow_up: "",
                        call_back: "",
                        status: "Booked",
                        createdAt: new Date()
                    });
                    
                    const ampmCheck = parseInt(appointmentTime.split(':')[0]);
                    const displayHr = ampmCheck % 12 === 0 ? 12 : ampmCheck % 12;
                    const displayStr = `${String(displayHr).padStart(2, '0')}:${appointmentTime.split(':')[1]} ${ampmCheck >= 12 ? 'PM' : 'AM'}`;
                    
                    alert(`Appointment logged successfully! Assigned to slot: ${displayStr}`);
                    
                    document.getElementById('createAppointmentForm').reset();
                    dateInput.value = toLocalDateStr(new Date());
                    customTimeInput.style.display = "none";
                    customTimeInput.removeAttribute('required');
                    clearAutoPopulatedFields();
                    monitorBookedSlots();
                }
            } catch (err) {
                console.error("Error saving record data payload: ", err);
                alert("Failed to save record.");
            }
        });

        checkEditMode();
    </script>
</body>
</html>
